name: Release npm (etassia)

# Trusted publishing (OIDC): requires the owner-side registration on
# npmjs.com — package `etassia`, owner `etassia`, repository `etassia-ts`,
# workflow `release.yml` (no environment claim). No npm token is stored; the
# publish job presents the OIDC id-token and npm verifies the provenance
# against that registration.

on:
  workflow_dispatch:
  push:
    tags: ["etassia-ts-v*"]

permissions:
  contents: read

concurrency:
  group: release-npm-etassia
  cancel-in-progress: false

env:
  GOLDEN_MMD: etassia-rs/golden/pie/pie_spec-0b1f3197.mmd
  GOLDEN_SVG: etassia-rs/golden/pie/pie_spec-0b1f3197.svg

jobs:
  build:
    name: build + pack (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: The tag version equals package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="etassia-ts-v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$want" || { echo "tag $GITHUB_REF_NAME does not equal $want"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p pkg
          npm pack --pack-destination pkg
          tar -tzf pkg/etassia-*.tgz | tee /dev/stderr | grep -q 'package/dist/etassia.wasm'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: pkg/*.tgz
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, node: "20" }
          - { os: macos-15, node: "22" }
          - { os: windows-latest, node: "22" }
    defaults:
      run:
        shell: bash
    steps:
      # autocrlf corrupted golden artifacts before; every checkout keeps LF.
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: tarball
      - name: Install the packed tarball into a clean project and byte-compare the golden case
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp tarball/etassia-*.tgz "$work/"
          cp "$GOLDEN_MMD" "$GOLDEN_SVG" scripts/smoke_installed_npm.mjs "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./etassia-*.tgz
          node smoke_installed_npm.mjs "$(basename "$GOLDEN_MMD")" "$(basename "$GOLDEN_SVG")"

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: pkg
      - name: Publish with provenance
        run: npm publish ./pkg/etassia-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: "" # explicit: trusted publishing only, no token
